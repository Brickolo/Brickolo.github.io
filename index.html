<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Portfolio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="images/logo.png" type="image/png">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;600&display=swap');

    a {
      color: inherit;
      text-decoration: none;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 1;
      pointer-events: none;
      z-index: 9999;
      background: #000;
      filter: url(#noiseFilter);
      opacity: 1.0;
      min-height: 100vh;
      mix-blend-mode: overlay;
      mask-image: radial-gradient(circle at center, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 100%);
      -webkit-mask-image: radial-gradient(circle at center, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 100%);
    }
    body {
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: linear-gradient(to bottom right, #00080a, #0b031d, #060000);
      color: #eee;
    }

    .top-navigation {
      display: flex;
      justify-content: center; /* Center the buttons horizontally */
      padding: 1rem 0;
      position: absolute; /* Changed from sticky to absolute */
      top: 0;
      left: 0; /* Align to the left edge */
      width: 100%; /* Make it span the entire width */
      z-index: 10; /* Ensure it's above other content */
    } 

    .top-navigation a {
      color: #eee;
      padding: 0.75rem 1.0rem;
      margin: 0 0.5rem;
      border-radius: 5px;
      transition: background-color 0.3s ease;
    }

    .top-navigation a:hover {
      background-color: #333;
    }

    .top-navigation .current-page {
      background-color: #555; /* Indicate the current page */
      font-weight: bold;
      cursor: default; /* Optional: change cursor to indicate it's not clickable */
    }

    .header {
      text-align: center;
      padding: 1rem 1rem 1rem; /* Reduced top padding */
    }

    .logo {
      width: 80px;
      margin-bottom: 10px;
      margin-top: 70px;
    }

    .header h1 {
      font-size: 2.5rem;
      font-weight: 600;
      margin: 0;
    }
    .modal-content h2 {
      padding-right: 50px;
      margin: 0;
      margin-bottom: 20px;
    }

    .header p {
      font-size: 1.2rem;
      font-weight: 300;
      color: #aaa;
      margin-top: 0.5rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(337px, 1fr));
      gap: 20px;
      padding: 1rem;
      max-width: 1400px;
      margin: auto;
    }

    .project {
      aspect-ratio: 4 / 3;
      overflow: hidden;
      background: #1a1a1a;
      box-shadow: 0 0 10px rgba(0,0,0,0.4);
      cursor: pointer;
      border-radius: 10px;
      transition: box-shadow 0.2s ease;
    }

    .project:hover {
      aspect-ratio: 4 / 3;
      overflow: hidden;
      background: #1a1a1a;
      box-shadow: 0 0 20px rgba(0,0,0,0.6);
      cursor: pointer;
      border-radius: 10px;
      transition: box-shadow 0.3s ease;
    }

    .project img {
      width: 100%;
      height: 100%;
      transition: transform 0.2s ease;
      object-fit: cover;
      display: block;
    }

    .project img:hover {
      transform: scale(1.01);
      transition: transform 0.2s ease;
      object-fit: cover;
      display: block;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.95);
      overflow-y: auto;
      z-index: 999;
      padding-top: 40px;
      padding-right: 90px;
      justify-content: center;
      align-items: flex-start;
    }

    .modal-content {
      background: #222;
      margin: 0 auto;
      padding: 30px;
      padding-top: 30px;
      padding-bottom: 80px;
      width: 80%;
      max-width: 900px;
      position: relative;
      border-radius: 10px;
      color: #eee;
      margin-bottom: 150px; /* Space between the modal content and the bottom of the page */
    }

    .close {
      position: absolute;
      top: 20px; right: 30px;
      font-size: 30px;
      cursor: pointer;
    }

    .modal-images img {
      width: 100%;
      margin-bottom: 15px;
      border-radius: 8px;
    }

    .modal-images .caption {
      font-size: 1rem;
      margin: 10px 0 20px;
      color: #ccc;
    }
    .footer {
      color: #aaa;
      display: flex;
      flex-direction: column;  /* Stack items vertically */
      justify-content: center; /* Center the content vertically */
      align-items: center;    /* Center the content horizontally */
      padding: 20px;
      font-size: 0.9rem;
      position: relative;
      width: 100%;
      max-width: 1400px; /* Align the footer with the max width of your thumbnails */
      margin: auto;    /* Center the footer */
      box-sizing: border-box;  /* Make sure padding doesn't affect the layout */
    }
    .footer .disclaimer {
      text-align: center;
      color: #aaa;
      text-decoration: none;
      margin-top: 30px;  /* Add space above the disclaimer */
    }
    .footer .contact-link {
      font-size: 2rem;
      text-align: left;
      color: #ffffff;
      text-decoration: none;
      margin-bottom: 20px;  /* Add space below the contact link */
    }
    .footer .contact-link:hover {
      color: #aaa;
    }
    .back-to-top {
      color: #aaa;
      text-decoration: none;
      font-size: 1rem;
      margin-top: 9px;
      margin-bottom: 20px;
      display: inline-block;
      transition: color 0.2s ease;
    }

    .back-to-top:hover {
      color: #fff;
    }
    html {
      scroll-behavior: smooth;
    }
    #modal-top-anchor {
      position: absolute;
      top: 0;
      left: 0;
      width: 1px;
      height: 1px;
      pointer-events: none;
    }
    .bottom-close {
      position: absolute;
      bottom: 30px;
      left: 20px;
      background: #444;
      color: #eee;
      border: none;
      padding: 10px 16px;
      font-size: 1rem;
      border-radius: 6px;
      cursor: pointer;
    }
    .bottom-close:hover {
      background: #666;
    }
    .modal-content .back-to-top {
      position: absolute;
      bottom: 20px;
      right: 30px;
      margin-top: 0;
    }
    .fullscreen-image {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1000;
      background:rgba(0, 0, 0, 0.6);
      justify-content: center;
      align-items: center;
      cursor: zoom-out;
      padding: 0; /* Remove any padding */
      inset: 0;
    }

    .fullscreen-image img {
      object-fit: contain;
      box-shadow: 0 0 90px rgba(0,0,0,1);
      cursor: zoom-out;
      display: block;
      margin: auto;
      max-width: 100vw;
      max-height: 100vh;
    }

    .close-fullscreen {
      position: absolute;
      top: 20px;
      right: 30px;
      font-size: 40px;
      color: #fff;
      cursor: pointer;
      z-index: 1001;
    }

    .modal-images img {
      cursor: zoom-in;
    }
    .modal-images img {
      opacity: 0;
      transition: opacity 0.6s ease;
    }

    .modal-images img.loaded {
      opacity: 1;
    }
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .project {
      opacity: 0;
      animation: fadeIn 0.8s ease forwards;
    }
    @media (max-width: 500px) {
      .logo {
        width: 90px;
      }

      .header h1 {
        font-size: 2.5rem;
      }
      .header p {
        font-size: 1.1rem;
      }
      .footer {
        font-size: 0.8rem;
        padding: 40px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 20px;
        padding: 1rem;
        max-width: 1400px;
        margin: auto;
      }
      .modal-content {
        width: 75%;
        padding: 20px;
        padding-bottom: 90px;
      }
      .close {
        top: 7px; right: 30px;
        font-size: 40px;
      }
      .modal-images .caption {
        font-size: 0.9rem;
      }
    }
  </style>

</head>
<body>

          { type: "youtube", embed: "https://www.youtube.com/embed/z4WkV22c-1w?si=NvgdBAkpxV-OJHbe" },

      {

        ]
      }
    ];
    // Create fullscreen image container
    const fullscreenHTML = `
    <div class="fullscreen-image" id="fullscreen-image">
      <span class="close-fullscreen" id="close-fullscreen">×</span>
      <img id="fullscreen-img" src="">
    </div>`;
    document.body.insertAdjacentHTML('beforeend', fullscreenHTML);

    // Back to top button functionality
    document.querySelectorAll('.back-to-top').forEach(button => {
      button.addEventListener('click', function (e) {
        e.preventDefault();

        const modal = this.closest('.modal');

        if (modal && modal.style.display !== 'none') {
          // Scroll the modal if we're inside it
          modal.scrollTo({ top: 0, behavior: 'smooth' });
        } else {
          // Scroll the whole page if we're outside
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      });
    });

    // Fullscreen image functions
    function openFullscreen(imgSrc) {
      const fullscreenImg = document.getElementById('fullscreen-img');
      fullscreenImg.src = imgSrc;
      document.getElementById('fullscreen-image').style.display = 'flex';
      document.body.style.overflow = 'hidden'; // Prevent scrolling
    }

    function closeFullscreen() {
      document.getElementById('fullscreen-image').style.display = 'none';
      document.body.style.overflow = ''; // Restore scrolling
    }

    // Set up event listeners for fullscreen mode
    document.getElementById('close-fullscreen').addEventListener('click', closeFullscreen);
    document.getElementById('fullscreen-image').addEventListener('click', function(e) {
      if (e.target === this) closeFullscreen();
    });

    // Make the fullscreen image clickable to close
    document.getElementById('fullscreen-img').addEventListener('click', function(e) {
      e.stopPropagation(); // Prevent double triggering with parent click
      closeFullscreen();
    });

    // Keyboard support
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        if (document.getElementById('fullscreen-image').style.display === 'flex') {
          closeFullscreen();
        } else if (document.getElementById('modal').style.display === 'flex') {
          closeModal();
        }
      }
    });

    // Portfolio grid generation
    const portfolio = document.getElementById('portfolio');
    projects.forEach((project, index) => {
      const div = document.createElement('div');
      div.className = 'project';
      div.style.animationDelay = `${index * 200}ms`;
      div.innerHTML = `
        <img src="${project.thumbnail}" alt="${project.name} thumbnail">
        <div>${project.name}</div>
      `;
      div.onclick = () => {
        document.getElementById('modal-title').innerText = project.name;
        const container = document.getElementById('modal-images');
        container.innerHTML = '';

        project.content.forEach(item => {
          if (typeof item === 'string' && item.endsWith('.png')) {
            const img = document.createElement('img');
            img.src = item;
            img.onload = () => img.classList.add('loaded');
            img.addEventListener('click', function(e) {
              e.stopPropagation(); // Prevent triggering modal close
              openFullscreen(this.src);
            });
            container.appendChild(img);
          } else if (typeof item === 'object' && item.type === 'youtube') {
            const wrapper = document.createElement('div');
            wrapper.style.position = 'relative';
            wrapper.style.paddingTop = '56.25%';
            wrapper.style.marginBottom = '15px';

            const iframe = document.createElement('iframe');
            iframe.src = item.embed;
            iframe.style.position = 'absolute';
            iframe.style.top = '0';
            iframe.style.left = '0';
            iframe.style.width = '100%';
            iframe.style.height = '100%';
            iframe.style.border = '0';
            iframe.style.borderRadius = '8px';
            iframe.allowFullscreen = true;

            wrapper.appendChild(iframe);
            container.appendChild(wrapper);
          } else if (typeof item === 'object' && item.type === 'label') {
            const label = document.createElement('div');
            label.innerText = item.text;
            //label.style.textAlign = 'center';
            label.style.fontWeight = '600';
            label.style.margin = '30px 0 10px';
            label.className = 'caption';
            container.appendChild(label);
          } else {
            const text = document.createElement('div');
            text.className = 'caption';
            text.innerHTML = item;
            container.appendChild(text);
          }
        });

        document.getElementById('modal').style.display = 'flex';
      };
      portfolio.appendChild(div);
    });

    // Modal functions
    const modal = document.getElementById('modal');

    function openModal() {
      modal.style.display = 'flex';
      document.body.classList.add('modal-open');
    }

    function closeModal() {
      modal.style.display = 'none';
      document.body.classList.remove('modal-open');
      // Reset any iframes if needed:
      document.querySelectorAll('#modal iframe').forEach(iframe => iframe.src = iframe.src);
    }

    // Modal close events
    document.getElementById('close').onclick = closeModal;
    window.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });

    // Touch handling for mobile
    let startX, startY, isTap = true;

    window.addEventListener('touchstart', (e) => {
      const touch = e.touches[0];
      startX = touch.pageX;
      startY = touch.pageY;
      isTap = true;  // Assume it's a tap unless proven otherwise
    });

    window.addEventListener('touchmove', (e) => {
      const touch = e.touches[0];
      const diffX = Math.abs(touch.pageX - startX);
      const diffY = Math.abs(touch.pageY - startY);

      // If the finger moves too far (e.g., more than 10px in any direction), it's a swipe/scroll
      if (diffX > 10 || diffY > 10) {
        isTap = false;  // It's not a tap anymore
      }
    });

    window.addEventListener('touchend', (e) => {
      if (isTap && e.target === modal) {
        setTimeout(() => closeModal(), 50);  // Delay to avoid conflicts
      }
    });

    const img = document.querySelector('.fullscreen-image img');

    function resizeToFit() {
      const aspectRatio = img.naturalWidth / img.naturalHeight;
      const screenRatio = window.innerWidth / window.innerHeight;

      if (aspectRatio > screenRatio) {
        img.style.width = '95%';
        img.style.height = 'auto';
      } else {
        img.style.height = '95%';
        img.style.width = 'auto';
      }
    }


    img.onload = resizeToFit;

    window.addEventListener('resize', resizeToFit);
  </script>
