<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Portfolio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="images/logo.png" type="image/png">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;600&display=swap');
    
    a {
        color: inherit;
        text-decoration: none;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 1;
      pointer-events: none;
      z-index: 9999;
      background: #000;
      filter: url(#noiseFilter);
      opacity: 1.0;
      min-height: 100vh;
      mix-blend-mode: overlay;
      mask-image: radial-gradient(circle at center, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 100%);
      -webkit-mask-image: radial-gradient(circle at center, rgba(0,0,0,1) 40%, rgba(0,0,0,0) 100%);
    }
    body {
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: linear-gradient(to bottom right, #00080a, #0b031d, #060000);
      color: #eee;
    }
    
  
    .header {
      text-align: center;
      padding: 2rem 1rem 1rem;
    }
  
    .logo {
      width: 80px;
      margin-bottom: 10px;
    }
  
    .header h1 {
      font-size: 2.5rem;
      font-weight: 600;
      margin: 0;
    }
    .modal-content h2 {
      padding-right: 50px;
      margin: 0;
      margin-bottom: 20px;
    }
  
    .header p {
      font-size: 1.2rem;
      font-weight: 300;
      color: #aaa;
      margin-top: 0.5rem;
    }
  
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
      gap: 20px;
      padding: 1rem;
      max-width: 1400px;
      margin: auto;
    }
  
    .project {
      aspect-ratio: 4 / 3;
      overflow: hidden;
      background: #1a1a1a;
      box-shadow: 0 0 10px rgba(0,0,0,0.4);
      cursor: pointer;
      border-radius: 10px;
      transition: box-shadow 0.2s ease;
    }

    .project:hover {
      aspect-ratio: 4 / 3;
      overflow: hidden;
      background: #1a1a1a;
      box-shadow: 0 0 20px rgba(0,0,0,0.6);
      cursor: pointer;
      border-radius: 10px;
      transition: box-shadow 0.3s ease;
    }
  
    .project img {
      width: 100%;
      height: 100%;
      transition: transform 0.2s ease;
      object-fit: cover;
      display: block;
    }

    .project img:hover {
      transform: scale(1.01);
      transition: transform 0.2s ease;
      object-fit: cover;
      display: block;
    }
  
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.95);
      overflow-y: auto;
      z-index: 999;
      padding-top: 40px;
      padding-right: 90px;
      justify-content: center;
      align-items: flex-start;
    }
  
    .modal-content {
      background: #222;
      margin: 0 auto;
      padding: 30px;
      padding-top: 30px;
      padding-bottom: 80px;
      width: 80%;
      max-width: 800px;
      position: relative;
      border-radius: 10px;
      color: #eee;
      margin-bottom: 150px; /* Space between the modal content and the bottom of the page */
    }
  
    .close {
      position: absolute;
      top: 20px; right: 30px;
      font-size: 30px;
      cursor: pointer;
    }
  
    .modal-images img {
      width: 100%;
      margin-bottom: 15px;
      border-radius: 8px;
    }
  
    .modal-images .caption {
      font-size: 1rem;
      margin: 10px 0 20px;
      color: #ccc;
    }
    .footer {
      color: #aaa;
      display: flex;
      flex-direction: column;  /* Stack items vertically */
      justify-content: center; /* Center the content vertically */
      align-items: center;     /* Center the content horizontally */
      padding: 30px;
      font-size: 0.9rem;
      position: relative;
      width: 100%;
      max-width: 1400px; /* Align the footer with the max width of your thumbnails */
      margin: auto;  /* Center the footer */
      box-sizing: border-box;  /* Make sure padding doesn't affect the layout */
    }
    .footer .disclaimer {
      text-align: left;
      color: #aaa;
      text-decoration: none;
      margin-top: 40px;  /* Add space above the disclaimer */
    }
    .footer .contact-link {
      font-size: 2rem;
      text-align: left;
      color: #ffffff;
      text-decoration: none;
      margin-bottom: 10px;  /* Add space below the contact link */
    }
    .footer .contact-link:hover {
      color: #aaa;
    }
    .back-to-top {
      color: #aaa;
      text-decoration: none;
      font-size: 0.9rem;
      margin-top: 30px;
      margin-bottom: 0px;
      display: inline-block;
      transition: color 0.2s ease;
    }

    .back-to-top:hover {
      color: #fff;
    }
    html {
      scroll-behavior: smooth;
    }
    #modal-top-anchor {
      position: absolute;
      top: 0;
      left: 0;
      width: 1px;
      height: 1px;
      pointer-events: none;
    }
    .bottom-close {
      position: absolute;
      bottom: 30px;
      left: 20px;
      background: #444;
      color: #eee;
      border: none;
      padding: 10px 16px;
      font-size: 1rem;
      border-radius: 6px;
      cursor: pointer;
    }
    .bottom-close:hover {
      background: #666;
    }
    .modal-content .back-to-top {
      position: absolute;
      bottom: 40px;
      right: 30px;
      margin-top: 0;
    }
    @media (max-width: 500px) {
      .logo {
        width: 90px;
      }

      .header h1 {
        font-size: 2.5rem;
      }
      .header p {
        font-size: 1.1rem;
      }
      .footer {
        font-size: 0.8rem;
        padding: 40px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 20px;
        padding: 1rem;
        max-width: 1400px;
        margin: auto;
      }
      .modal-content {
          width: 75%;
          padding: 20px;
          padding-bottom: 90px;
      }
      .close {
        top: 7px; right: 30px;
        font-size: 40px;
      }
      .modal-images .caption {
        font-size: 0.9rem;
      }
    }
  </style>

</head>
<body>

  <div class="header">
    <a href="/">
      <img src="images/logo.png" alt="Logo" class="logo">
      <h1>Nicco3D</h1>
      <p>Automotive Specialised 3D Modeling & Rendering Services</p>
    </a>
  </div>

  <div class="grid" id="portfolio"></div>

  <div class="modal" id="modal">
    <div class="modal-content">
      <div id="modal-top-anchor"></div> <!-- Invisible anchor at top -->
      <span class="close" id="close">&times;</span>
      <h2 id="modal-title"></h2>
      <div class="modal-images" id="modal-images"></div>
      <a href="#" class="back-to-top">↑ Back to Top</a>
      <button class="bottom-close" onclick="closeModal()">Close</button>
    </div>
  </div>

  <footer class="footer">
    <a href="/about" class="contact-link">About</a>
    <a href="/contact" class="contact-link">Contact Info</a>
    <a href="#" class="back-to-top">↑ Back to Top</a>
    <div class="disclaimer">© Nicco3D 2025. All the trademarks, brands and logos are the property of their respective owners.</div>
  </footer>

      {

      {

    document.querySelectorAll('.back-to-top').forEach(button => {
      button.addEventListener('click', function (e) {
        e.preventDefault();

        const modal = this.closest('.modal');

        if (modal && modal.style.display !== 'none') {
          // Scroll the modal if we're inside it
          modal.scrollTo({ top: 0, behavior: 'smooth' });
        } else {
          // Scroll the whole page if we're outside
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      });
    });
    const portfolio = document.getElementById('portfolio');
    projects.forEach(project => {
      const div = document.createElement('div');
      div.className = 'project';
      div.innerHTML = `
        <img src="${project.thumbnail}" alt="${project.name} thumbnail">
        <div>${project.name}</div>
      `;
      div.onclick = () => {
        document.getElementById('modal-title').innerText = project.name;
        const container = document.getElementById('modal-images');
        container.innerHTML = '';

        project.content.forEach(item => {
          if (typeof item === 'string' && item.endsWith('.png')) {
            const img = document.createElement('img');
            img.src = item;
            container.appendChild(img);
          } else if (typeof item === 'object' && item.type === 'youtube') {
            const wrapper = document.createElement('div');
            wrapper.style.position = 'relative';
            wrapper.style.paddingTop = '56.25%';
            wrapper.style.marginBottom = '15px';

            const iframe = document.createElement('iframe');
            iframe.src = item.embed;
            iframe.style.position = 'absolute';
            iframe.style.top = '0';
            iframe.style.left = '0';
            iframe.style.width = '100%';
            iframe.style.height = '100%';
            iframe.style.border = '0';
            iframe.style.borderRadius = '8px';
            iframe.allowFullscreen = true;

            wrapper.appendChild(iframe);
            container.appendChild(wrapper);
          } else if (typeof item === 'object' && item.type === 'label') {
            const label = document.createElement('div');
            label.innerText = item.text;
            //label.style.textAlign = 'center';
            label.style.fontWeight = '600';
            label.style.margin = '30px 0 10px';
            label.className = 'caption';
            container.appendChild(label);
          } else {
            const text = document.createElement('div');
            text.className = 'caption';
            text.innerHTML = item;
            container.appendChild(text);
          }
        });


        document.getElementById('modal').style.display = 'flex';
      };
      portfolio.appendChild(div);
    });
    const modal = document.getElementById('modal');

    function openModal() {
      modal.style.display = 'flex';
      document.body.classList.add('modal-open');
    }

    function closeModal() {
      modal.style.display = 'none';
      document.body.classList.remove('modal-open');
      // Reset any iframes if needed:
      document.querySelectorAll('#modal iframe').forEach(iframe => iframe.src = iframe.src);
    }

    // Example: Binding to your close button and modal click
    document.getElementById('close').onclick = closeModal;
    window.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
    let startX, startY, isTap = true;

    window.addEventListener('touchstart', (e) => {
      const touch = e.touches[0];
      startX = touch.pageX;
      startY = touch.pageY;
      isTap = true;  // Assume it's a tap unless proven otherwise
    });

    window.addEventListener('touchmove', (e) => {
      const touch = e.touches[0];
      const diffX = Math.abs(touch.pageX - startX);
      const diffY = Math.abs(touch.pageY - startY);

      // If the finger moves too far (e.g., more than 10px in any direction), it's a swipe/scroll
      if (diffX > 10 || diffY > 10) {
        isTap = false;  // It's not a tap anymore
      }
    });

    window.addEventListener('touchend', (e) => {
      if (isTap && e.target === modal) {
        setTimeout(() => closeModal(), 50);  // Delay to avoid conflicts
      }
    });

    // When opening the modal (e.g., by clicking on a portfolio item), call openModal()
    portfolio.addEventListener('click', openModal);

</html>
